            <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
      <div class="card-body text-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-check-circle-fill text-success mb-3" viewBox="0 0 16 16">
          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM6.97 11.03a.75.75 0 0 0 1.08 0l3.992-3.992a.75.75 0 1 0-1.06-1.06L7.5 9.439 5.06 6.999a.75.75 0 1 0-1.06 1.06l2.97 2.97z"/>
        </svg>

        <h5 class="card-title">Login efetuado com sucesso</h5>
        <p class="card-text mb-1">Você será redirecionado em <strong id="counter">5</strong> segundos.</p>
        <p class="text-muted small">Caso não queira esperar, clique no botão abaixo.</p>

        <div class="d-flex justify-content-center gap-2 mt-3">
          <a id="btn-continue" class="btn btn-primary">Ir agora</a>
          <button id="btn-cancel" class="btn btn-outline-secondary">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURAÇÃO ---
    const redirectUrl = "Menu.html"; // Mude para o site de destino
    let countdownSeconds = 5; // Mude o número de segundos do contador
    // ---------------------

    const counterEl = document.getElementById('counter');
    const btnContinue = document.getElementById('btn-continue');
    const btnCancel = document.getElementById('btn-cancel');

    // Atualiza texto do botão com link
    btnContinue.href = redirectUrl;

    // Função de redirecionamento
    function doRedirect() {
      // Se quiser abrir na mesma aba:
      window.location.href = redirectUrl;
      // Se preferir abrir em nova aba, use:
      // window.open(redirectUrl, '_blank');
    }

    // Inicia contador regressivo
    counterEl.textContent = countdownSeconds;
    let timer = setInterval(() => {
      countdownSeconds -= 1;
      if (countdownSeconds <= 0) {
        clearInterval(timer);
        counterEl.textContent = 0;
        doRedirect();
      } else {
        counterEl.textContent = countdownSeconds;
      }
    }, 1000);

    // Botão "Ir agora" redireciona imediatamente
    btnContinue.addEventListener('click', (e) => {
      // evita qualquer comportamento padrão e redireciona via JS para garantir consistência
      e.preventDefault();
      clearInterval(timer);
      doRedirect();
    });

    // Botão "Cancelar" para interromper o redirecionamento
    btnCancel.addEventListener('click', () => {
      clearInterval(timer);
      btnCancel.disabled = true;
      btnCancel.textContent = "Cancelado";
      // Opcional: alterar mensagem para usuário
      document.querySelector('.card-text').textContent = "Redirecionamento cancelado. Você está logado.";
    });
  </script>

  <!-- Bootstrap JS (opcional, só se usar componentes JS do Bootstrap) -->
